<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174c43">
  <meta name="description" content="경복대학교 캠퍼스의 건물과 공간을 3D로 둘러보는 ZERO ARCHITECT 건축투어">
  <title>캠퍼스 건축투어 | ZERO ARCHITECT</title>
  <link rel="canonical" href="https://zeroarchitect.kr/kbu/">
  <style>
    *{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Arial,sans-serif;color:#1d1d1f;background:#edf2ef}
    header{background:#fff;border-bottom:1px solid #deded9;flex:0 0 auto}.top{max-width:1200px;margin:auto;padding:14px 22px}.brand{display:flex;align-items:center;gap:15px;flex-wrap:wrap;text-decoration:none;color:inherit;width:fit-content}.brand img{height:30px;width:auto;object-fit:contain}.brand strong{font-size:18px;font-weight:850}.brand span{font-size:12px;color:#62676a;line-height:1.5}
    main{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}.tourBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px max(20px,calc((100vw - 1156px)/2));background:#fff;border-bottom:1px solid #deded9}.eyebrow{margin:0 0 4px;font-size:12px;font-weight:700;color:#174c43}.tourBar h1{font-size:21px;margin:0;word-break:keep-all}.return{display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border:1px solid #deded9;border-radius:10px;background:#fff;color:#174c43;font-size:13px;font-weight:750;text-decoration:none}.return:hover{background:#e7efec}.return:focus-visible,.brand:focus-visible{outline:3px solid #78b5a4;outline-offset:3px}
    .status{margin:0;padding:8px 20px;color:#62676a;font-size:12px;line-height:1.5;background:#f4f7f5}.status[hidden]{display:none}.frameHost{position:relative;flex:1 1 auto;min-height:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#edf2ef}
    @media(max-width:600px){.top{padding:12px 16px}.brand{gap:8px 12px}.brand span{flex-basis:100%;padding-left:0}.tourBar{padding:10px 14px;gap:8px}.tourBar h1{font-size:19px}.return{font-size:12px;padding:10px 12px}.status{padding:7px 14px;font-size:11px}}
  </style>
</head>
<body>
  <header><div class="top"><a class="brand" href="/"><img src="/assets/kbu-logo.png" alt="경복대학교"><strong>ZERO ARCHITECT</strong><span>AI for Everyone, Everywhere.</span></a></div></header>
  <main aria-labelledby="campusTitle">
    <div class="tourBar"><div><p class="eyebrow">건축탐구</p><h1 id="campusTitle">캠퍼스 건축투어</h1></div><a class="return" href="/">← 실습으로 돌아가기</a></div>
    <p class="status" id="tourStatus" role="status">캠퍼스 화면을 불러오는 중…</p>
    <div class="frameHost"><iframe id="campusFrame" title="경복대학교 캠퍼스 건축투어" src="https://kyungbok-campus-3d.drh333.chatgpt.site/?embed=zeroarchitect" allow="fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  </main>
  <script>
    const frame=document.getElementById('campusFrame'),status=document.getElementById('tourStatus');
    frame.addEventListener('load',()=>{status.hidden=true;});
    frame.addEventListener('error',()=>{status.textContent='캠퍼스 화면을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';status.hidden=false;});
  </script>
</body>
</html>
